<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cosmicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080B11" />
    </linearGradient>

    <!-- Planet & Ring Gradients -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="alphaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cosmicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="240" rx="16" fill="url(#cosmicBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Star Field Elements -->
  <g fill="#94A3B8" opacity="0.4">
    <circle cx="45" cy="40" r="1.5" />
    <circle cx="95" cy="190" r="1" />
    <circle cx="210" cy="30" r="1.2" />
    <circle cx="720" cy="60" r="1.5" />
    <circle cx="760" cy="180" r="1" />
    <circle cx="680" cy="205" r="1.2" />
    <circle cx="480" cy="35" r="1" />
  </g>

  <!-- Orbital Ring Behind Icon -->
  <ellipse cx="120" cy="120" rx="90" ry="32" transform="rotate(-28, 120, 120)" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-dasharray="6,4" />

  <!-- Helmet / Cosmonaut Emblem -->
  <g transform="translate(45, 45)">
    <!-- Outer Shield / Hexagonal Aura -->
    <polygon points="75,5 135,35 135,115 75,145 15,115 15,35" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
    
    <!-- Helmet Outer Shell -->
    <circle cx="75" cy="75" r="52" fill="#1E293B" stroke="url(#helmetGrad)" stroke-width="3.5" filter="url(#softGlow)" />
    
    <!-- Helmet Inner Visor -->
    <ellipse cx="75" cy="72" rx="38" ry="28" fill="#090D16" stroke="#38BDF8" stroke-width="2" />
    <ellipse cx="75" cy="72" rx="32" ry="22" fill="#0F172A" />

    <!-- Visor Reflection -->
    <path d="M 52,62 Q 75,52 98,62 A 32,22 0 0,1 52,62" fill="url(#goldGrad)" opacity="0.75" filter="url(#softGlow)" />
    <ellipse cx="64" cy="65" rx="8" ry="4" fill="#FFFFFF" opacity="0.3" transform="rotate(-15, 64, 65)" />

    <!-- Space Mission Stars / Constellation -->
    <circle cx="75" cy="18" r="2.5" fill="#38BDF8" filter="url(#cosmicGlow)" />
    <circle cx="125" cy="60" r="2" fill="#FCD34D" />
    <circle cx="25" cy="60" r="2" fill="#FCD34D" />
  </g>

  <!-- Satellite Orbit Path Foreground -->
  <ellipse cx="120" cy="120" rx="90" ry="32" transform="rotate(-28, 120, 120)" fill="none" stroke="url(#helmetGrad)" stroke-width="3" stroke-dasharray="140, 260" stroke-linecap="round" />
  <circle cx="188" cy="85" r="4" fill="#38BDF8" filter="url(#cosmicGlow)" />

  <!-- Typography: YURI GAGARIN -->
  <g transform="translate(230, 95)">
    <text font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="900" font-size="38" letter-spacing="4" fill="url(#textGrad)">
      YURI GAGARIN
    </text>
  </g>

  <!-- Typography: ALPHA / Tagline -->
  <g transform="translate(232, 142)">
    <rect x="0" y="-22" width="105" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
    <text x="12" y="0" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="19" letter-spacing="3" fill="url(#alphaGrad)">
      ALPHA
    </text>

    <!-- Badge / Subtitle -->
    <text x="125" y="-1" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="600" font-size="14.5" letter-spacing="1.5" fill="#94A3B8">
      ENTERPRISE HIGH-PERFORMANCE BIG-DATA SEARCH ENGINE
    </text>
  </g>

  <!-- Features Pills -->
  <g transform="translate(232, 185)">
    <g transform="translate(0, 0)">
      <rect width="130" height="22" rx="11" fill="#131C31" stroke="#2563EB" stroke-width="1" />
      <circle cx="10" cy="11" r="3.5" fill="#38BDF8" />
      <text x="20" y="15" font-family="monospace" font-size="10.5" font-weight="bold" fill="#BAE6FD">AHO-CORASICK</text>
    </g>

    <g transform="translate(140, 0)">
      <rect width="100" height="22" rx="11" fill="#131C31" stroke="#6366F1" stroke-width="1" />
      <circle cx="10" cy="11" r="3.5" fill="#818CF8" />
      <text x="20" y="15" font-family="monospace" font-size="10.5" font-weight="bold" fill="#C7D2FE">JIT REGEX</text>
    </g>

    <g transform="translate(250, 0)">
      <rect width="145" height="22" rx="11" fill="#131C31" stroke="#059669" stroke-width="1" />
      <circle cx="10" cy="11" r="3.5" fill="#34D399" />
      <text x="20" y="15" font-family="monospace" font-size="10.5" font-weight="bold" fill="#A7F3D0">RESOURCE-TUNED</text>
    </g>

    <g transform="translate(405, 0)">
      <rect width="125" height="22" rx="11" fill="#131C31" stroke="#D97706" stroke-width="1" />
      <circle cx="10" cy="11" r="3.5" fill="#FBBF24" />
      <text x="20" y="15" font-family="monospace" font-size="10.5" font-weight="bold" fill="#FDE68A">WEB UI + TELEGRAM</text>
    </g>
  </g>
</svg>
