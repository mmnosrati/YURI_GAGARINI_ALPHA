<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 140" width="100%" height="100%">
  <defs>
    <!-- Dark Space Glow Background -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95" />
    </linearGradient>

    <!-- Neon Cyan & Electric Violet Gradients -->
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="goldVisor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="textWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Pill -->
  <rect x="4" y="4" width="752" height="132" rx="20" fill="url(#bgGlow)" stroke="url(#cyberNeon)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Cosmonaut Crest Emblem (Left) -->
  <g transform="translate(30, 20)">
    <!-- Outer Orbit Ring -->
    <ellipse cx="50" cy="50" rx="46" ry="16" transform="rotate(-28 50 50)" fill="none" stroke="url(#cyberNeon)" stroke-width="2.5" stroke-dasharray="120 15 30 15" opacity="0.85" />
    
    <!-- Helmet Shield Base -->
    <circle cx="50" cy="50" r="38" fill="#0B132B" stroke="url(#cyberNeon)" stroke-width="3" />
    
    <!-- Gold Visor Reflection -->
    <ellipse cx="50" cy="46" rx="26" ry="17" fill="url(#goldVisor)" />
    <path d="M 30 46 Q 50 36 70 46 Q 50 42 30 46 Z" fill="#FFF" opacity="0.65" />
    
    <!-- Red Star Insignia -->
    <path d="M 50 20 L 52.5 26 L 58 26 L 53.5 29.5 L 55 35 L 50 31.5 L 45 35 L 46.5 29.5 L 42 26 L 47.5 26 Z" fill="#EF4444" />
    
    <!-- Orbiting Satellite Dot -->
    <circle cx="86" cy="30" r="3.5" fill="#38BDF8" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(155, 30)">
    <!-- Main Title -->
    <text x="0" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" letter-spacing="4" fill="url(#textWhite)">
      YURI GAGARIN
    </text>
    
    <!-- ALPHA Badge Tag -->
    <g transform="translate(390, 12)">
      <rect x="0" y="0" width="110" height="34" rx="8" fill="url(#cyberNeon)" />
      <text x="55" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="800" font-size="16" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">
        ALPHA
      </text>
    </g>

    <!-- Subtitle Meta Description -->
    <text x="0" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="500" font-size="12.5" letter-spacing="1.5" fill="#38BDF8">
      ENTERPRISE BIG-DATA SEARCH ENGINE &bull; MULTI-GB/s SIMD
    </text>
  </g>

  <!-- Status Ping Indicator (Right) -->
  <g transform="translate(710, 40)">
    <circle cx="0" cy="0" r="5" fill="#10B981" />
    <circle cx="0" cy="0" r="10" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.4" />
  </g>
</svg>
