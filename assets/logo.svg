<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 260" width="100%" height="100%">
  <defs>
    <!-- Deep Space Background Gradient -->
    <linearGradient id="spaceDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="45%" stop-color="#0B101E" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>

    <!-- Metallic Astronaut Shield Gradients -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="visorReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.4" />
    </linearGradient>

    <!-- Typography Gradients -->
    <linearGradient id="yuriTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="alphaGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="orbitGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="epicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="950" height="260" rx="20" fill="url(#spaceDeep)" stroke="#1E293B" stroke-width="2" />

  <!-- Constellations and Stars -->
  <g fill="#94A3B8">
    <circle cx="65" cy="45" r="1.5" opacity="0.6" />
    <circle cx="120" cy="225" r="1.2" opacity="0.4" />
    <circle cx="280" cy="35" r="1.8" opacity="0.8" />
    <circle cx="890" cy="50" r="1.5" opacity="0.5" />
    <circle cx="840" cy="210" r="1.2" opacity="0.6" />
    <circle cx="915" cy="180" r="1.8" opacity="0.7" />
    <circle cx="580" cy="235" r="1" opacity="0.3" />
    <circle cx="440" cy="30" r="1" opacity="0.5" />
  </g>

  <!-- ==================== LEFT ICON: COSMONAUT & ORBIT ==================== -->
  <g transform="translate(40, 20)">
    <!-- Back Orbit Ring -->
    <ellipse cx="100" cy="110" rx="95" ry="34" transform="rotate(-25, 100, 110)" fill="none" stroke="url(#orbitGlow)" stroke-width="3" stroke-dasharray="10, 6" />

    <!-- Cosmonaut Shield (Hexagonal Tech Base) -->
    <polygon points="100,10 175,50 175,160 100,205 25,160 25,50" fill="#0A0E1A" stroke="url(#shieldBorder)" stroke-width="2.5" />

    <!-- Helmet Outer Ring -->
    <circle cx="100" cy="108" r="54" fill="#131B2E" stroke="#38BDF8" stroke-width="3" filter="url(#subtleGlow)" />

    <!-- Helmet Collar Ring -->
    <path d="M 68,145 C 80,158 120,158 132,145" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" />

    <!-- Visor Sphere -->
    <ellipse cx="100" cy="104" rx="42" ry="32" fill="#030712" stroke="#38BDF8" stroke-width="1.8" />

    <!-- Golden Visor Reflection (Earth Horizon from Space) -->
    <path d="M 64,96 C 80,82 120,82 136,96 C 136,118 64,118 64,96 Z" fill="url(#visorReflect)" opacity="0.85" filter="url(#subtleGlow)" />
    
    <!-- Visor Sunlight Glare -->
    <ellipse cx="85" cy="94" rx="10" ry="4" fill="#FFFFFF" opacity="0.5" transform="rotate(-20, 85, 94)" />
    <circle cx="122" cy="114" r="2.5" fill="#FFFFFF" opacity="0.7" />

    <!-- Foreground Orbit Ring Slice (Overlap for 3D depth) -->
    <path d="M 22,140 C 40,175 140,185 185,130" fill="none" stroke="url(#shieldBorder)" stroke-width="3.5" stroke-linecap="round" filter="url(#epicGlow)" />

    <!-- Orbit Satellite Node -->
    <circle cx="185" cy="130" r="5" fill="#38BDF8" filter="url(#epicGlow)" />
    <circle cx="185" cy="130" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- ==================== TYPOGRAPHY & BRANDING ==================== -->
  <!-- "YURI GAGARIN" -->
  <text x="270" y="98" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="4" fill="url(#yuriTextGrad)">
    YURI GAGARIN
  </text>

  <!-- "ALPHA" BADGE & SUBTITLE -->
  <g transform="translate(270, 122)">
    <!-- Alpha Pill Badge -->
    <rect x="0" y="0" width="108" height="32" rx="8" fill="#111827" stroke="url(#alphaGlowGrad)" stroke-width="1.8" />
    <text x="54" y="22" font-family="'Inter', Roboto, sans-serif" font-weight="900" font-size="18" letter-spacing="3" fill="url(#alphaGlowGrad)" text-anchor="middle">
      ALPHA
    </text>

    <!-- Subtitle (Well-padded within 950px boundary) -->
    <text x="124" y="21" font-family="'Inter', -apple-system, Roboto, sans-serif" font-weight="700" font-size="13" letter-spacing="2" fill="#94A3B8">
      ENTERPRISE BIG-DATA TEXT SEARCH PLATFORM
    </text>
  </g>

  <!-- ==================== TECHNOLOGY METRIC PILLS ==================== -->
  <g transform="translate(270, 185)">
    <!-- Pill 1: Aho-Corasick -->
    <g transform="translate(0, 0)">
      <rect width="145" height="28" rx="8" fill="#0C1322" stroke="#2563EB" stroke-width="1.2" />
      <circle cx="15" cy="14" r="4" fill="#38BDF8" filter="url(#subtleGlow)" />
      <text x="28" y="18" font-family="monospace" font-size="11.5" font-weight="700" fill="#E0F2FE">AHO-CORASICK</text>
    </g>

    <!-- Pill 2: JIT Regex -->
    <g transform="translate(155, 0)">
      <rect width="115" height="28" rx="8" fill="#0C1322" stroke="#6366F1" stroke-width="1.2" />
      <circle cx="15" cy="14" r="4" fill="#818CF8" />
      <text x="28" y="18" font-family="monospace" font-size="11.5" font-weight="700" fill="#E0E7FF">JIT REGEX</text>
    </g>

    <!-- Pill 3: Resource Guard -->
    <g transform="translate(280, 0)">
      <rect width="160" height="28" rx="8" fill="#0C1322" stroke="#059669" stroke-width="1.2" />
      <circle cx="15" cy="14" r="4" fill="#34D399" />
      <text x="28" y="18" font-family="monospace" font-size="11.5" font-weight="700" fill="#D1FAE5">RESOURCE-TUNED</text>
    </g>

    <!-- Pill 4: Web + Telegram -->
    <g transform="translate(450, 0)">
      <rect width="165" height="28" rx="8" fill="#0C1322" stroke="#D97706" stroke-width="1.2" />
      <circle cx="15" cy="14" r="4" fill="#FBBF24" />
      <text x="28" y="18" font-family="monospace" font-size="11.5" font-weight="700" fill="#FEF3C7">WEB UI + TELEGRAM</text>
    </g>
  </g>
</svg>
