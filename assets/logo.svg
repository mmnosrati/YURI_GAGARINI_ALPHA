<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 140" width="760" height="140">
  <defs>
    <!-- Deep Cosmic Space Background Gradient -->
    <linearGradient id="cosmicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C1B" />
      <stop offset="50%" stop-color="#050814" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <!-- Electric Violet & Cyan Neon Gradient (Inspired by reference palette) -->
    <linearGradient id="neonOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#818CF8" />
      <stop offset="80%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Gold Solar Visor Reflection -->
    <linearGradient id="visorGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Metallic Typography Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Alpha Badge Gradient -->
    <linearGradient id="alphaBadgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glow Filter for Emblems -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Backdrop Pill -->
  <rect x="3" y="3" width="754" height="134" rx="20" fill="url(#cosmicBg)" stroke="url(#neonOrbit)" stroke-width="1.8" />

  <!-- Background Stars & Constellation Points -->
  <g fill="#94A3B8" opacity="0.35">
    <circle cx="160" cy="22" r="1.2" />
    <circle cx="280" cy="18" r="1.5" />
    <circle cx="530" cy="24" r="1.2" />
    <circle cx="680" cy="20" r="1.4" />
    <circle cx="725" cy="115" r="1.2" />
    <circle cx="480" cy="122" r="1" />
  </g>

  <!-- ==================== COSMONAUT CREST EMBLEM (LEFT) ==================== -->
  <g transform="translate(30, 16)">
    <!-- Outer Elliptical Orbit Rings (Tilted Angle) -->
    <ellipse cx="54" cy="54" rx="50" ry="18" transform="rotate(-28 54 54)" fill="none" stroke="url(#neonOrbit)" stroke-width="2.5" stroke-dasharray="130 18 35 15" opacity="0.9" filter="url(#neonGlow)" />
    <ellipse cx="54" cy="54" rx="52" ry="19" transform="rotate(45 54 54)" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.4" />

    <!-- Circular Tech Shield Base -->
    <circle cx="54" cy="54" r="42" fill="#060919" stroke="url(#neonOrbit)" stroke-width="3" />
    <circle cx="54" cy="54" r="39" fill="none" stroke="#1E293B" stroke-width="1.5" />

    <!-- Helmet Suit Collar Arc -->
    <path d="M 32,78 C 42,90 66,90 76,78" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />

    <!-- Cosmonaut Helmet Visor -->
    <ellipse cx="54" cy="50" rx="28" ry="19" fill="url(#visorGold)" stroke="#38BDF8" stroke-width="1.5" />
    
    <!-- Visor Horizon Glare & Specular Reflection -->
    <path d="M 33 50 Q 54 39 75 50 Q 54 44 33 50 Z" fill="#FFFFFF" opacity="0.8" />
    <circle cx="43" cy="45" r="2" fill="#FFFFFF" opacity="0.9" />

    <!-- Red Star Emblem on Helmet -->
    <path d="M 54 21 L 56.5 27 L 62.5 27 L 57.5 30.5 L 59.5 36.5 L 54 33 L 48.5 36.5 L 50.5 30.5 L 45.5 27 L 51.5 27 Z" fill="#EF4444" />

    <!-- Orbiting Satellite Dot -->
    <circle cx="94" cy="32" r="4" fill="#38BDF8" filter="url(#neonGlow)" />
    <circle cx="94" cy="32" r="2" fill="#FFFFFF" />
  </g>

  <!-- ==================== BRAND TYPOGRAPHY & TAGS ==================== -->
  <g transform="translate(160, 28)">
    <!-- Main Title -->
    <text x="0" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" letter-spacing="4" fill="url(#titleGrad)">
      YURI GAGARIN
    </text>

    <!-- ALPHA Pill Badge -->
    <g transform="translate(390, 13)">
      <rect x="0" y="0" width="112" height="34" rx="8" fill="url(#alphaBadgeGrad)" filter="url(#neonGlow)" />
      <text x="56" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="800" font-size="16" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">
        ALPHA
      </text>
    </g>

    <!-- Subtitle Meta Description -->
    <text x="0" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="600" font-size="12" letter-spacing="1.5" fill="#38BDF8">
      ENTERPRISE BIG-DATA SEARCH ENGINE • MULTI-GB/s SIMD
    </text>
  </g>

  <!-- ==================== STATUS PING INDICATOR (RIGHT) ==================== -->
  <g transform="translate(712, 42)">
    <circle cx="0" cy="0" r="5" fill="#10B981" />
    <circle cx="0" cy="0" r="10" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" values="6;13;6" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
